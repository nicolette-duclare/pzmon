<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PZMon</title>
  <style>
    :root{
      --bg:#0b0f14; --card:#121826; --text:#e6edf3; --muted:#9aa4b2;
      --border:#1f2a3a; --accent:#2dd4bf; --accent2:#f59e0b;
    }
    body { margin: 18px; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    h2 { margin: 0 0 6px 0; }
    h3 { margin: 0 0 10px 0; }
    .muted { color: var(--muted); margin: 0 0 14px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .card { background: var(--card); padding: 14px; border: 1px solid var(--border); border-radius: 14px; }
    code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 10px; }
    .kvs b { display:inline-block; min-width: 110px; color: var(--muted); font-weight: 600; }
    canvas { width: 100%; height: 120px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
    th { color: var(--muted); font-weight: 700; }
    .pill { display:inline-block; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .legend { font-size: 12px; color: var(--muted); }
    .legend .rx { color: var(--accent); }
    .legend .tx { color: var(--accent2); }
    .btns { display:flex; gap:6px; margin: 0 0 14px 0; flex-wrap: wrap; }
    .btn { cursor:pointer; padding: 4px 12px; border-radius: 999px; border:1px solid var(--border); background: var(--card); color: var(--muted); font-size: 13px; }
    .btn.active { border-color: var(--accent); color: var(--text); }
    .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 4px; }
    .bar > span { display:block; height:100%; background: var(--accent); }
  </style>
</head>
<body>
  <h2>PZMon</h2>
  <p class="muted" id="subtitle">Loading…</p>

  <div class="btns" id="ranges"></div>

  <div class="grid">
    <div class="card">
      <h3>System</h3>
      <div class="kvs" id="sys">Loading…</div>
    </div>

    <div class="card">
      <h3>Wi-Fi</h3>
      <div class="kvs" id="wifi">Loading…</div>
      <div style="margin-top:10px">
        <div class="pill">Signal %</div>
        <canvas id="wifiChart" width="600" height="180"></canvas>
      </div>
    </div>

    <div class="card">
      <h3>CPU</h3>
      <div class="kvs" id="cpu">Loading…</div>
      <div style="margin-top:10px">
        <div class="pill">CPU % history</div>
        <canvas id="cpuChart" width="600" height="180"></canvas>
      </div>
    </div>

    <div class="card">
      <h3>Memory</h3>
      <div class="kvs" id="mem">Loading…</div>
      <div style="margin-top:10px">
        <div class="pill">RAM % history</div>
        <canvas id="memChart" width="600" height="180"></canvas>
      </div>
    </div>

    <div class="card">
      <h3>Disks</h3>
      <div id="disks">Loading…</div>
    </div>

    <div class="card">
      <h3>Network</h3>
      <div id="net">Loading…</div>
      <div style="margin-top:10px">
        <div class="legend"><span class="rx">&#9632; rx</span> &nbsp; <span class="tx">&#9632; tx</span></div>
        <canvas id="netChart" width="600" height="180"></canvas>
      </div>
    </div>

    <div class="card" style="grid-column: 1 / -1;">
      <h3>Top processes (CPU)</h3>
      <div id="procs">Loading…</div>
    </div>
  </div>

<script>
const CONFIG = {{ config|tojson }};
const REFRESH_MS = CONFIG.refresh_ms;
const HISTORY_LEN = CONFIG.history_len;

let mode = "live";            // "live" or a range key (e.g. "1h")
let histTimer = null;
const live = { cpu: [], mem: [], wifi: [], rx: [], tx: [] };

function fmtBytes(n) {
  if (n === null || n === undefined) return "-";
  const u = ["B","KB","MB","GB","TB"];
  let i = 0, x = n;
  while (x >= 1024 && i < u.length-1) { x /= 1024; i++; }
  return `${x.toFixed(1)} ${u[i]}`;
}
function fmtRate(n) { return n === null || n === undefined ? "-" : fmtBytes(n) + "/s"; }
function fmtDuration(s) {
  if (s === null || s === undefined) return "-";
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  if (d > 0) return `${d}d ${h}h ${m}m`;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s%60}s`;
  return `${s}s`;
}

function pushHist(arr, v) {
  if (v === null || v === undefined || Number.isNaN(v)) v = 0;
  arr.push(v);
  while (arr.length > HISTORY_LEN) arr.shift();
}

// seriesList: [{data:[...], color:"..."}]; maxY may be a number or "auto".
function drawChart(canvasId, seriesList, minY, maxY) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext("2d");
  const w = c.width, h = c.height;
  ctx.clearRect(0,0,w,h);

  ctx.globalAlpha = 0.6;
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 1;
  for (let i=1;i<=4;i++){ const y=(h*i)/5; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  ctx.globalAlpha = 1.0;

  let top = maxY;
  if (maxY === "auto") {
    let m = 0;
    for (const s of seriesList) for (const v of s.data) if (v != null && v > m) m = v;
    top = m > 0 ? m * 1.2 : 1;
  }

  const maxLen = Math.max(1, ...seriesList.map(s => s.data.length));
  const span = mode === "live" ? Math.max(1, HISTORY_LEN-1) : Math.max(1, maxLen-1);
  const pad = 10, x0 = pad, y0 = pad, x1 = w-pad, y1 = h-pad;
  const dx = (x1-x0) / span;

  for (const s of seriesList) {
    if (!s.data.length) continue;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i=0;i<s.data.length;i++){
      const v = s.data[i] == null ? 0 : s.data[i];
      const t = Math.min(1, Math.max(0, (v - minY) / (top - minY)));
      const x = x0 + i*dx;
      const y = y1 - t*(y1-y0);
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}

function drawCharts() {
  const accent = "rgba(45,212,191,0.9)", accent2 = "rgba(245,158,11,0.9)";
  const src = mode === "live" ? live : window._hist || { cpu:[], mem:[], wifi:[], rx:[], tx:[] };
  drawChart("cpuChart",  [{data: src.cpu,  color: accent}], 0, 100);
  drawChart("memChart",  [{data: src.mem,  color: accent}], 0, 100);
  drawChart("wifiChart", [{data: src.wifi, color: accent}], 0, 100);
  drawChart("netChart",  [{data: src.rx, color: accent}, {data: src.tx, color: accent2}], 0, "auto");
}

async function refresh() {
  let s;
  try { s = await fetch("/api/status").then(r => r.json()); }
  catch (e) { return; }

  document.getElementById("subtitle").textContent =
    `${s.hostname} · auto-refresh every ${REFRESH_MS/1000}s · ${s.psutil ? "" : "psutil missing — some metrics unavailable"}`;

  document.getElementById("sys").innerHTML =
    `<b>IP</b> <code>${s.ip}</code><br>` +
    `<b>Hostname</b> ${s.hostname}<br>` +
    `<b>Uptime</b> ${fmtDuration(s.system_uptime_seconds)}<br>` +
    `<b>App uptime</b> ${fmtDuration(s.process_uptime_seconds)}<br>` +
    `<b>CPU temp</b> ${(s.cpu_temp_c ?? "-")} °C<br>` +
    `<b>Load</b> ${s.load1} / ${s.load5} / ${s.load15}<br>`;

  document.getElementById("cpu").innerHTML =
    `<b>CPU usage</b> ${(s.cpu_usage_percent ?? "-")} %<br>`;

  document.getElementById("mem").innerHTML =
    `<b>RAM</b> ${fmtBytes(s.mem_used)} / ${fmtBytes(s.mem_total)} (${s.mem_percent ?? "-"}%)<br>`;

  // disks
  const disks = (s.disks || []).map(d =>
    `<div style="margin-bottom:8px"><b>${d.path}</b> ${fmtBytes(d.used)} / ${fmtBytes(d.total)} (${d.percent ?? "-"}%)` +
    `<div class="bar"><span style="width:${Math.min(100, d.percent || 0)}%"></span></div></div>`
  ).join("");
  document.getElementById("disks").innerHTML = disks || "<span class='muted'>No disks</span>";

  // wifi
  const wifiLine = (s.wifi_signal_dbm !== null && s.wifi_signal_dbm !== undefined)
    ? `${s.wifi_signal_dbm} dBm (${s.wifi_signal_percent ?? "-"}%)` : "-";
  document.getElementById("wifi").innerHTML =
    `<b>Interface</b> ${s.wifi_iface || "wlan0"}<br><b>Signal</b> ${wifiLine}<br>`;

  // network per-interface
  const ifaces = Object.keys(s.net || {});
  const netRows = ifaces.map(nic =>
    `<b>${nic}</b> &#8595; ${fmtRate(s.net[nic].rx_per_s)} &nbsp; &#8593; ${fmtRate(s.net[nic].tx_per_s)}<br>`
  ).join("");
  document.getElementById("net").innerHTML =
    (netRows || "<span class='muted'>No interfaces</span>") +
    `<div style="margin-top:6px" class="muted">total &#8595; ${fmtRate(s.net_rx_per_s)} &nbsp; &#8593; ${fmtRate(s.net_tx_per_s)}</div>`;

  // processes
  const rows = (s.top_processes || []).map(p =>
    `<tr><td>${p.pid}</td><td>${p.name}</td><td>${p.cpu}%</td><td>${fmtBytes(p.rss)}</td></tr>`
  ).join("");
  document.getElementById("procs").innerHTML =
    `<table><thead><tr><th>PID</th><th>Name</th><th>CPU</th><th>RSS</th></tr></thead><tbody>${rows}</tbody></table>`;

  if (mode === "live") {
    pushHist(live.cpu, s.cpu_usage_percent);
    pushHist(live.mem, s.mem_percent);
    pushHist(live.wifi, s.wifi_signal_percent);
    pushHist(live.rx, s.net_rx_per_s);
    pushHist(live.tx, s.net_tx_per_s);
    drawCharts();
  }
}

async function loadHistory(range) {
  try {
    const d = await fetch(`/api/history?range=${range}`).then(r => r.json());
    window._hist = { cpu: d.cpu, mem: d.mem, wifi: d.wifi, rx: d.rx_per_s, tx: d.tx_per_s };
    drawCharts();
  } catch (e) { /* ignore */ }
}

function setMode(m) {
  mode = m;
  document.querySelectorAll(".btn").forEach(b => b.classList.toggle("active", b.dataset.mode === m));
  if (histTimer) { clearInterval(histTimer); histTimer = null; }
  if (m === "live") {
    drawCharts();
  } else {
    loadHistory(m);
    histTimer = setInterval(() => loadHistory(m), 20000);
  }
}

function buildButtons() {
  const wrap = document.getElementById("ranges");
  const modes = ["live", ...CONFIG.ranges];
  wrap.innerHTML = modes.map(m =>
    `<div class="btn ${m==='live'?'active':''}" data-mode="${m}">${m === "live" ? "Live" : m}</div>`
  ).join("");
  wrap.querySelectorAll(".btn").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
}

buildButtons();
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
